import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.publish.maven.tasks.GenerateMavenPom

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
}

class Config {
    static final String GROUP_ID = 'com.caoccao.javet'
    static final String NAME = 'Javet'
    static final String VERSION = Versions.JAVET
    static final String URL = 'https://github.com/caoccao/Javet'

    static class Pom {
        static final String ARTIFACT_ID = 'javet'
        static final String DESCRIPTION = 'Javet is Java + V8 (JAVa + V + EighT). It is an awesome way of embedding Node.js and V8 in Java.'

        static class Developer {
            static final String ID = 'caoccao'
            static final String EMAIL = 'sjtucaocao@gmail.com'
            static final String NAME = 'Sam Cao'
            static final String ORGANIZATION = 'caoccao.com'
            static final String ORGANIZATION_URL = 'https://www.caoccao.com'
        }

        static class License {
            static final String NAME = 'APACHE LICENSE, VERSION 2.0'
            static final String URL = 'https://github.com/caoccao/Javet/blob/main/LICENSE'
        }

        static class Scm {
            static final String CONNECTION = 'scm:git:git://github.com/Javet.git'
            static final String DEVELOPER_CONNECTION = 'scm:git:ssh://github.com/Javet.git'
        }
    }

    static class Projects {
        // https://mvnrepository.com/artifact/net.bytebuddy/byte-buddy
        static final String BYTE_BUDDY = "net.bytebuddy:byte-buddy:${Versions.BYTE_BUDDY}"

        // https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-databind
        static final String JACKSON_DATABIND = "com.fasterxml.jackson.core:jackson-databind:${Versions.JACKSON_DATABIND}"

        // https://mvnrepository.com/artifact/com.caoccao.javet.buddy/javet-buddy
        static final String JAVET_BUDDY = "com.caoccao.javet.buddy:javet-buddy:${Versions.JAVET_BUDDY}"

        // https://mvnrepository.com/artifact/org.eclipse.jetty.websocket/javax-websocket-server-impl
        static final String JETTY_JAVAX_WEBSOCKET_SERVER_IMPL = "org.eclipse.jetty.websocket:javax-websocket-server-impl:${Versions.JETTY_WEBSOCKET}"

        // https://mvnrepository.com/artifact/org.eclipse.jetty.websocket/websocket-server
        static final String JETTY_WEBSOCKET_SERVER = "org.eclipse.jetty.websocket:websocket-server:${Versions.JETTY_WEBSOCKET}"
    }

    static class Versions {
        static final String BYTE_BUDDY = '1.15.5'
        static final String JACKSON_DATABIND = '2.16.0'
        static final String JAVA_VERSION = '1.8'
        static final String JAVET = '5.0.8'
        static final String JAVET_BUDDY = '0.4.0'
        static final String JETTY_WEBSOCKET = '9.4.53.v20231009'
        static final String JUNIT = '5.11.3'
    }
}

def buildDirectory = layout.buildDirectory.get().asFile

group = Config.GROUP_ID
version = Config.VERSION

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    testImplementation Config.Projects.BYTE_BUDDY
    testImplementation Config.Projects.JACKSON_DATABIND
    testImplementation Config.Projects.JAVET_BUDDY
    testImplementation Config.Projects.JETTY_JAVAX_WEBSOCKET_SERVER_IMPL
    testImplementation Config.Projects.JETTY_WEBSOCKET_SERVER
//    testImplementation files("../JavetBuddy/build/libs/javet-buddy-${Config.Versions.JAVET_BUDDY}.jar")
}

afterEvaluate {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add('-Xlint:unchecked')
        options.compilerArgs.add('-Xlint:deprecation')
    }
}

tasks.register('buildJNIHeaders', Exec) {
    doFirst {
        mkdir "${buildDirectory}/generated/tmp/jni"
    }
    workingDir "$projectDir"
    commandLine 'javac',
            '-h',
            'cpp/jni',
            '-d',
            "${buildDirectory}/generated/tmp/jni",
            'src/main/java/com/caoccao/javet/interop/INodeNative.java',
            'src/main/java/com/caoccao/javet/interop/IV8Native.java',
            'src/main/java/com/caoccao/javet/interop/NodeNative.java',
            'src/main/java/com/caoccao/javet/interop/V8Native.java'
}

tasks.jar {
    manifest {
        attributes 'Automatic-Module-Name': Config.GROUP_ID
    }
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit Jupiter test framework
            useJUnitJupiter(Config.Versions.JUNIT)
        }
    }
}

tasks.test {
    useJUnitPlatform {
        excludeTags 'performance'
    }
}

tasks.register('performanceTest', Test) {
    useJUnitPlatform {
        includeTags 'performance'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.withType(GenerateMavenPom).configureEach {
    destination = file("${buildDirectory}/libs/${Config.Pom.ARTIFACT_ID}-${Config.VERSION}.pom")
}

publishing {
    publications {
        create('generatePom', MavenPublication) {
            from components.java
            pom {
                artifactId = Config.Pom.ARTIFACT_ID
                description = Config.Pom.DESCRIPTION
                groupId = Config.GROUP_ID
                name = Config.NAME
                url = Config.URL
                version = Config.VERSION
                licenses {
                    license {
                        name = Config.Pom.License.NAME
                        url = Config.Pom.License.URL
                    }
                }
                developers {
                    developer {
                        id = Config.Pom.Developer.ID
                        email = Config.Pom.Developer.EMAIL
                        name = Config.Pom.Developer.NAME
                        organization = Config.Pom.Developer.ORGANIZATION
                        organizationUrl = Config.Pom.Developer.ORGANIZATION_URL
                    }
                }
                scm {
                    connection = Config.Pom.Scm.CONNECTION
                    developerConnection = Config.Pom.Scm.DEVELOPER_CONNECTION
                    tag = Config.Versions.JAVET
                    url = Config.URL
                }
                properties = [
                        'maven.compiler.source': Config.Versions.JAVA_VERSION,
                        'maven.compiler.target': Config.Versions.JAVA_VERSION,
                ]
            }
        }
    }
}